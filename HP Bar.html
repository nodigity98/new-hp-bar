<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjustable Health Bars</title>
    <style>
        body {
            background-color: #00FF00; /* Green background */
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .character {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Distribute items evenly */
            margin-bottom: 20px;
        }
        .character-details {
            flex: 1; /* Takes up remaining space */
        }
        .health-bar-container {
            width: 200px;
            height: 20px;
            background-color: #ddd;
            position: relative;
        }
        .health-bar {
            height: 100%;
            background-color: red; /* Set health bar color to red */
            transition: width 0.3s ease-in-out; /* Smooth transition animation */
        }
        .health-text {
            position: absolute;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            line-height: 20px;
            top: 0;
            left: 0;
            pointer-events: none; /* Ensure text doesn't interfere with input */
        }

        /* Small addition: makes the universal controls look neat, but doesn't change your layout much */
        .global-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<h1>Adjustable Health Bars</h1>

<!-- Universal controls -->
<div class="global-controls">
    <label for="character-select"><strong>Target:</strong></label>
    <select id="character-select"></select>

    <input type="number" id="global-adjust-amount" placeholder="Amount" />

    <button onclick="adjustSelected(1)">Add</button>
    <button onclick="adjustSelected(-1)">Subtract</button>
</div>

<div id="characters"></div>

<script>
    const characters = [
        { name: 'Starzin', maxHp: 51, currentHp: 51 },
        { name: 'Sips', maxHp: 70, currentHp: 70 },
        { name: 'Brutus', maxHp: 51, currentHp: 51 },
        { name: 'Zephyrin', maxHp: 63, currentHp: 63 },
        { name: 'Ship', maxHp: 234, currentHp: 234 },
        { name: 'Ship 2', maxHp: 234, currentHp: 234 }
    ];

    function updateHealthBar(character) {
        const healthBar = document.getElementById(`health-bar-${character.name}`);
        const healthText = document.getElementById(`health-text-${character.name}`);
        const percentage = (character.currentHp / character.maxHp) * 100;
        healthBar.style.width = `${percentage}%`;
        healthText.innerText = `${character.currentHp}/${character.maxHp}`;
    }

    function renderCharacterSelect() {
        const select = document.getElementById('character-select');
        select.innerHTML = characters.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    }

    function renderCharacters() {
        const container = document.getElementById('characters');
        container.innerHTML = '';

        characters.forEach(character => {
            const characterDiv = document.createElement('div');
            characterDiv.classList.add('character');
            characterDiv.innerHTML = `
                <div class="character-details">
                    <h2>${character.name}</h2>
                    <div>Max HP: <input type="number" id="max-hp-${character.name}" value="${character.maxHp}" /></div>
                </div>
                <div class="health-bar-container">
                    <div id="health-bar-${character.name}" class="health-bar"></div>
                    <div id="health-text-${character.name}" class="health-text">${character.currentHp}/${character.maxHp}</div>
                </div>
            `;
            container.appendChild(characterDiv);

            document.getElementById(`max-hp-${character.name}`).addEventListener('change', (e) => {
                character.maxHp = parseInt(e.target.value, 10);
                // Clamp current HP if max HP is lowered below it
                character.currentHp = Math.min(character.currentHp, character.maxHp);
                updateHealthBar(character);
            });

            updateHealthBar(character);
        });
    }

    // Keep your adjust logic, just make it use the universal controls
    function adjustHealth(characterName, multiplier) {
        const character = characters.find(char => char.name === characterName);
        const amountInput = document.getElementById('global-adjust-amount');
        const amount = parseInt(amountInput.value, 10) * multiplier;

        if (!isNaN(amount)) {
            character.currentHp = Math.max(0, Math.min(character.maxHp, character.currentHp + amount));
            updateHealthBar(character);
            amountInput.value = ''; // Clear after adjusting (same behavior you had)
        }
    }

    function adjustSelected(multiplier) {
        const selectedName = document.getElementById('character-select').value;
        adjustHealth(selectedName, multiplier);
    }

    // Allow only numbers and backspace in the universal amount input (same vibe as your original)
    const globalAmountInput = document.getElementById('global-adjust-amount');
    globalAmountInput.addEventListener('input', () => {
        globalAmountInput.value = globalAmountInput.value.replace(/[^0-9]/g, '');
    });

    renderCharacterSelect();
    renderCharacters();
</script>

</body>
</html>
